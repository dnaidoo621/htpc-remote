name: Build & Release

# Runs on every version tag push.
# Can also be triggered manually (workflow_dispatch) for dev builds;
# in that case no GitHub Release is created and no actual tag is pushed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.3). Overridden by the tag on real releases.'
        required: false
        default: '0.0.0-dev'

jobs:
  # ── Compute version string once and expose it to all downstream jobs ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version: $VER"

  # ── Debian / Ubuntu — .deb ────────────────────────────────────────────────
  build-deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb (debian:bookworm-slim via Docker)
        run: bash build-deb.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-deb
          path: '*.deb'

  # ── Fedora / RHEL / openSUSE — .rpm ───────────────────────────────────────
  build-rpm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .rpm (fedora:latest via Docker)
        run: bash build-rpm.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm
          path: '*.rpm'

  # ── Windows — .zip (extract + run install-windows.ps1) ────────────────────
  build-windows-zip:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows ZIP
        run: |
          STAGING="/tmp/htpc-remote-${VERSION}"
          mkdir -p "$STAGING"
          rsync -a \
            --exclude '.git' \
            --exclude '.deb-build' \
            --exclude '.rpm-build' \
            --exclude '*.deb' \
            --exclude '*.rpm' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.gitignore' \
            . "$STAGING/"
          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/htpc-remote-${VERSION}-windows.zip" \
              "htpc-remote-${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: '*-windows.zip'

  # ── Universal Linux tarball (Arch, openSUSE, other distros) ──────────────
  # Users download, extract, and run:  bash install.sh
  build-linux-tar:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux tarball
        run: |
          STAGING="/tmp/htpc-remote-${VERSION}"
          mkdir -p "$STAGING"
          rsync -a \
            --exclude '.git' \
            --exclude '.deb-build' \
            --exclude '.rpm-build' \
            --exclude '*.deb' \
            --exclude '*.rpm' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.gitignore' \
            . "$STAGING/"
          tar -C /tmp \
              -czf "${GITHUB_WORKSPACE}/htpc-remote-${VERSION}-linux.tar.gz" \
              "htpc-remote-${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-tar
          path: '*-linux.tar.gz'

  # ── GitHub Release (tag pushes only) ──────────────────────────────────────
  release:
    needs: [version, build-deb, build-rpm, build-windows-zip, build-linux-tar]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Glide HTPC Remote v${VERSION}" \
            --generate-notes \
            "dist/htpc-remote_${VERSION}_all.deb" \
            "dist/htpc-remote-${VERSION}-1.noarch.rpm" \
            "dist/htpc-remote-${VERSION}-windows.zip" \
            "dist/htpc-remote-${VERSION}-linux.tar.gz"
